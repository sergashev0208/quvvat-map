function popup(s){
 const tariffs=s.manual_tariffs||operatorTariffs[s.operator]||{};
 function price(period){
  const amount=tariffs[period];
  if(typeof amount!=='number'||!Number.isFinite(amount)||amount<0)return '&nbsp;';
  return esc(amount.toLocaleString('uz-UZ'))+' so‘m/kWh'+(tariffs.estimated?' <span class="muted">(Taxminiy)</span>':'');
 }
 const heading='<b>'+esc(s.name||'Stansiya')+'</b><br><span>'+esc(s.address||s.region||'')+'</span>';
 const coords=encodeURIComponent(s.lat+','+s.lon);
 const links='<p><a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/dir/?api=1&destination='+coords+'">Google yo‘nalish</a> · <a target="_blank" rel="noopener noreferrer" href="https://yandex.com/maps/?rtext=~'+coords+'&rtt=auto">Yandex yo‘nalish</a></p>';
 return heading+'<div class="tariff-only"><p><b>Kunduzgi narx</b><br>'+price('day')+'</p><p><b>Kechki narx</b><br>'+price('night')+'</p></div>'+links;
}
let markers=[];
function matches(s){if(userLocation&&$('nearby').checked&&distanceMeters(userLocation,s)>Number($('radius').value))return false;if($('op').value&&s.operator!==$('op').value)return false;if($('region').value&&s.region!==$('region').value)return false;const q=$('search').value.toLocaleLowerCase();if(q&&!(s.name+' '+s.address+' '+s.operator).toLocaleLowerCase().includes(q))return false;
return true;}
function draw(fit=false){layer.clearLayers();markers=[];let list=stations.filter(matches);list.sort(userLocation?(a,b)=>distanceMeters(userLocation,a)-distanceMeters(userLocation,b):(a,b)=>String(a.name).localeCompare(String(b.name)));const colors={available:'#0a9664',busy:'#d95049',unknown:'#7b8790',unavailable:'#343c43',reserved:'#db9521',faulted:'#343c43'};
let visible=list;
if(map.getZoom()<16){const groups=new Map();for(const s of list){const p=map.project([s.lat,s.lon],map.getZoom()),key=Math.floor(p.x/64)+':'+Math.floor(p.y/64);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(s);}visible=[];for(const group of groups.values()){if(group.length===1){visible.push(group[0]);continue;}const lat=group.reduce((a,s)=>a+s.lat,0)/group.length,lon=group.reduce((a,s)=>a+s.lon,0)/group.length;MapUI.marker([lat,lon],{title:group.length+' ta stansiya — yaqinlashtirish',icon:MapUI.divIcon({className:'',html:'<div class="cluster-pin">'+group.length+'</div>',iconSize:[44,44],iconAnchor:[22,22]})}).on('click',()=>map.setView([lat,lon],Math.min(16,map.getZoom()+2))).addTo(layer);}}
for(const s of visible){const state=status(s),fill=colors[state]||colors.unknown,brand=(payload.logos||{})[s.operator];let m;
if($('markerStyle').value==='logo'){const title=displayNames[s.operator]||s.operator,initial=s.operator==="noma'lum"?'?':title.split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase();const content=brand&&brand.data_url?'<img src="'+esc(brand.data_url)+'" alt="'+esc(title)+'">':'<span class="fallback">'+esc(initial)+'</span>';m=MapUI.marker([s.lat,s.lon],{title:title+' — '+s.name,alt:title,icon:MapUI.divIcon({className:'brand-marker',html:'<div class="brand-badge" style="background:'+esc(brand?.background||'#ffffff')+'">'+content+'<span class="status-dot" style="background:'+fill+'"></span></div>',iconSize:[46,42],iconAnchor:[23,21],popupAnchor:[0,-22]})});}else m=MapUI.circleMarker([s.lat,s.lon],{radius:6,color:'#fff',weight:1.2,fillColor:fill,fillOpacity:.9});m.on('click',()=>showStation(s)).bindTooltip(esc((displayNames[s.operator]||s.operator)+' — '+s.name)).addTo(layer);markers.push({s,m});}
if(fit&&userLocation&&$('nearby').checked&&radiusCircle){map.fitBounds(radiusCircle.getBounds(),{padding:[35,35],maxZoom:18,animate:false});}else if(fit&&list.length)map.fitBounds(list.map(s=>[s.lat,s.lon]),{padding:[25,25],maxZoom:14,animate:false});
if(selectedStation&&!list.includes(selectedStation))closeStation();else if(selectedStation)$('stationContent').innerHTML=popup(selectedStation);$('emptyResult').hidden=!!list.length;$('emptyResult').textContent=list.length?'':'Bu hududda stansiya topilmadi. Radius yoki filtrni o‘zgartiring.';}
map.on('zoomend',()=>draw(false));
function redrawLocation(){if(radiusCircle)map.removeLayer(radiusCircle);if(!userLocation)return;radiusCircle=MapUI.circle([userLocation.lat,userLocation.lon],{radius:Number($('radius').value),color:'#2477ed',weight:2,fillColor:'#2477ed',fillOpacity:.06,interactive:false}).addTo(map);}
// Local landmark lookup: never present a nearby station's address as the exact GPS address.
function locationName(point){
 let closest=null,best=Infinity;
 for(const station of stations){
  if(!Number.isFinite(station.lat)||!Number.isFinite(station.lon))continue;
  const address=String(station.address||'').trim(),name=String(station.name||'').trim();
  if(!address&&!name)continue;
  const distance=distanceMeters(point,station);
  if(distance<best){closest=station;best=distance;}
 }
 if(!closest||best>2000)return point.manual?'Xaritadan tanlangan joy':'Joylashuvingiz xaritada belgilandi';
 const parts=[closest.region,closest.address||closest.name].filter(Boolean);
 return [...new Set(parts)].join(', ')+' yaqinida';
}
function setLocation(lat,lon,accuracy,manual){userLocation={lat,lon,accuracy,manual};if(userMarker)map.removeLayer(userMarker);if(accuracyCircle)map.removeLayer(accuracyCircle);accuracyCircle=null;userMarker=MapUI.marker([lat,lon],{icon:MapUI.divIcon({className:'',html:'<div class="user-location"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000,title:manual?'Tanlangan markaz':'Mening joylashuvim'}).addTo(map).bindPopup(manual?'Xaritadan tanlangan markaz':'Sizning taxminiy joylashuvingiz');if(!manual&&Number.isFinite(accuracy))accuracyCircle=MapUI.circle([lat,lon],{radius:accuracy,color:'#2477ed',weight:1,dashArray:'4 4',fillOpacity:.03,interactive:false}).addTo(map);$('nearby').disabled=false;$('nearby').checked=true;$('radius').disabled=false;$('clearLocation').disabled=false;const address=locationName(userLocation);$('locationStatus').textContent=(manual?'Tanlangan joy: ':'Siz turgan joy: ')+address;userMarker.setPopupContent(esc(address));redrawLocation();draw(true);}

if(tg?.initData){tg.ready();tg.expand();tg.setHeaderColor('#ffffff');tg.setBackgroundColor('#f3f7f5');if(tg.isVersionAtLeast('7.7'))tg.disableVerticalSwipes();}
function miniAppLocation(success,failure,options){
 const lm=tg?.LocationManager;
 if(tg?.initData&&tg.isVersionAtLeast('8.0')&&lm){
  lm.init(()=>{if(!lm.isLocationAvailable){browserLocation();return;}lm.getLocation(p=>{if(p)success({coords:{latitude:p.latitude,longitude:p.longitude,accuracy:p.horizontal_accuracy}});else failure({code:1});});});
 }else browserLocation();
 function browserLocation(){if(navigator.geolocation)navigator.geolocation.getCurrentPosition(success,failure,options);else failure({code:2});}
}

$('pickLocation').addEventListener('click',()=>{pickingLocation=!pickingLocation;$('pickLocation').setAttribute('aria-pressed',String(pickingLocation));map.getContainer().style.cursor=pickingLocation?'crosshair':'';if(pickingLocation)$('locationStatus').textContent='Qidiruv markazi uchun xaritadagi kerakli joyni bosing.';});
map.on('click',e=>{if(!pickingLocation)return;locationRequest++;$('locate').disabled=false;pickingLocation=false;$('pickLocation').setAttribute('aria-pressed','false');map.getContainer().style.cursor='';setLocation(e.latlng.lat,e.latlng.lng,null,true);});
$('clearLocation').addEventListener('click',()=>{locationRequest++;userLocation=null;pickingLocation=false;$('pickLocation').setAttribute('aria-pressed','false');map.getContainer().style.cursor='';$('locate').disabled=false;for(const item of [userMarker,radiusCircle,accuracyCircle])if(item)map.removeLayer(item);userMarker=radiusCircle=accuracyCircle=null;$('nearby').checked=false;$('nearby').disabled=true;$('radius').disabled=true;$('clearLocation').disabled=true;$('locationStatus').textContent='Joylashuv tozalandi.';draw(true);});
$('radius').addEventListener('input',()=>{$('radiusLabel').textContent=distanceLabel(Number($('radius').value));redrawLocation();draw(false);});
$('radius').addEventListener('change',()=>draw(true));$('nearby').addEventListener('change',()=>draw(true));$('markerStyle').addEventListener('change',()=>draw(false));
for(const id of ['op','region'])$(id).addEventListener('change',()=>draw(true));$('search').addEventListener('input',()=>draw(true));

updateOptions();draw(true);setInterval(()=>draw(false),30000);
$('notice').style.display='none';
}
