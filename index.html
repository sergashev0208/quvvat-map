<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    />
    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <title>QuvvatUZ — Xarita</title>

    <meta
      name="description"
      content="O‘zbekistondagi elektromobil zaryadlash stansiyalarini toping."

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font: 14px system-ui;
        color: #182b26;
        background: #f3f7f5;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      header {
        background: #123c32;
        color: white;
        padding: 14px 18px;
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
      }

      h1 {
        font-size: 22px;
        margin: 0;
      }

      header small {
        opacity: 0.8;
      }

      .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        padding: 12px 16px;
        border-bottom: 1px solid #dce5e0;
      }

      select,
      input,
      button {
        font: inherit;
        padding: 9px;
        border: 1px solid #b6cbc0;
        border-radius: 7px;
        background: white;
      }

      input {
        min-width: 180px;
        flex: 1;
      }

      button {
        cursor: pointer;
        background: #d6f5e3;
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      #emptyResult {
        padding: 8px 16px;
      }

      #map {
        flex: 1;
        min-height: 200px;
      }

      .leaflet-popup-content {
        max-height: 390px;
        overflow: auto;
        width: 300px !important;
      }

      .card {
        padding: 9px 0;
        border-bottom: 1px solid #ddd;
      }

      .muted {
        color: #60756b;
        font-size: 12px;
      }

      .warning {
        background: #fff1cb;
        padding: 8px;
        border-radius: 5px;
      }

      .sources {
        font-size: 11px;
        margin-top: 6px;
      }

      .pill {
        font-weight: 600;
      }

      #notice {
        display: none;
        background: #fff1cb;
        padding: 10px 16px;
      }

      a {
        color: #086543;
      }

      #sourceSummary {
        font-size: 12px;
        padding: 0 16px 8px;
      }

      .legend {
        font-size: 12px;
      }

      @media (max-width: 600px) {
        .filters {
          padding: 8px;
          gap: 5px;
        }

        select {
          max-width: 47%;
        }

        header {
          padding: 10px;
        }

        input {
          width: 100%;
        }
      }

      .locationbar {
        display: flex;
        gap: 9px;
        align-items: center;
        flex-wrap: wrap;
        padding: 10px 16px;
        background: #e7f1ec;
        border-bottom: 1px solid #cadcd2;
      }

      .locationbar input[type="range"] {
        min-width: 120px;
        max-width: 240px;
        flex: 0;
      }

      .locationbar input[type="checkbox"] {
        min-width: 0;
        max-width: none;
        flex: none;
        width: 16px;
        height: 16px;
        margin: 0;
      }

      .locationbar label {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .locationbar output {
        min-width: 55px;
        font-weight: 600;
      }

      #locationStatus {
        width: 100%;
        font-size: 12px;
        color: #40594d;
      }

      .brand-marker {
        background: transparent;
        border: 0;
      }

      .brand-badge {
        width: 46px;
        height: 42px;
        position: relative;
        border-radius: 10px;
        box-shadow: 0 2px 7px #0005;
        background: #fff;
        border: 2px solid white;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .brand-badge img {
        width: 36px;
        height: 30px;
        object-fit: contain;
      }

      .brand-badge .fallback {
        font-size: 10px;
        font-weight: 800;
        text-align: center;
        overflow: hidden;
        padding: 2px;
        color: #203e33;
      }

      .status-dot {
        position: absolute;
        right: -4px;
        bottom: -4px;
        width: 13px;
        height: 13px;
        border: 2px solid white;
        border-radius: 50%;
      }

      .user-location {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #2477ed;
        border: 3px solid white;
        box-shadow: 0 0 0 4px #2477ed44;
      }

      .distance {
        font-weight: 700;
        color: #1757ad;
      }

      .locationbar button[aria-pressed="true"] {
        background: #bad6fb;
      }

      .marker-note {
        font-size: 11px;
        color: #617266;
      }

      /* Xarita interfeysi */

      :root {
        --ink: #172c27;
        --green: #087f5b;
        --line: #e3ebe7;
        --shadow: 0 8px 32px #17372a18;
      }

      body {
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        overflow: hidden;
        background: #e8eee9;
      }

      #map {
        position: absolute;
        inset: 0;
        z-index: 0;
        height: 100%;
        background: #e8eee9;
      }

      header {
        position: absolute;
        left: 24px;
        top: 24px;
        z-index: 500;
        width: 350px;
        background: white;
        color: var(--ink);
        padding: 18px 20px;
        border-radius: 22px 22px 0 0;
        display: block;
        box-shadow: var(--shadow);
      }

      header h1 {
        font-size: 25px;
        letter-spacing: -1px;
      }

      header span {
        display: block;
        font-size: 12px;
        color: #72827a;
        margin-top: 5px;
      }

      .filters {
        position: absolute;
        top: 107px;
        left: 24px;
        width: 350px;
        z-index: 501;
        padding: 0 16px 16px;
        background: white;
        border: 0;
        border-radius: 0 0 22px 22px;
        gap: 8px;
        box-shadow: 0 15px 25px #17372a12;
      }

      input,
      select,
      button {
        min-height: 44px;
        border-radius: 12px;
        border: 1px solid var(--line);
        color: var(--ink);
        background: #f5f8f6;
        font: inherit;
        transition:
          background 0.15s,
          box-shadow 0.15s;
      }

      button:hover {
        background: #e5f2eb;
      }

      button:disabled {
        cursor: default;
        opacity: 0.45;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 3px solid #65bda1;
        outline-offset: 3px;
      }

      .filters input {
        width: 100%;
        flex-basis: 100%;
        min-width: 0;
        padding: 13px 14px;
        font-size: 15px;
      }

      .filters select {
        width: calc(50% - 4px);
        max-width: none;
        min-width: 0;
        flex: 1;
        font-size: 12px;
      }

      .locationbar {
        position: absolute;
        left: 24px;
        bottom: 28px;
        z-index: 500;
        width: 350px;
        background: white;
        padding: 14px;
        border-radius: 20px;
        box-shadow: var(--shadow);
        border: 1px solid #ffffffa0;
        display: block;
        max-height: calc(100dvh - 260px);
        overflow: auto;
      }

      #locate {
        width: 100%;
        background: var(--green);
        color: white;
        font-weight: 650;
        border: 0;
        min-height: 48px;
      }

      #locate:hover {
        background: #066d4e;
      }

      .locationbar details {
        margin-top: 8px;
      }

      .locationbar summary {
        cursor: pointer;
        padding: 10px 4px;
        font-weight: 600;
        list-style: none;
        display: flex;
        justify-content: space-between;
      }

      .locationbar summary:after {
        content: "＋";
        color: var(--green);
      }

      .locationbar details[open] summary:after {
        content: "−";
      }

      .location-options {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding-top: 6px;
      }

      .location-options button {
        font-size: 12px;
        flex: 1;
      }

      .location-options #markerStyle {
        width: 100%;
        max-width: none;
      }

      .location-options input[type="range"] {
        min-width: 110px;
        max-width: none;
        flex: 1;
        accent-color: var(--green);
        padding: 0;
        border: 0;
        min-height: 32px;
      }

      .location-options input[type="checkbox"] {
        accent-color: var(--green);
      }

      .location-options label[for="radius"] {
        flex-basis: 100%;
        font-size: 12px;
        font-weight: 600;
      }

      .location-options label:has(#nearby) {
        flex-basis: 100%;
        font-size: 12px;
      }

      #locationStatus:empty {
        display: none;
      }

      #locationStatus {
        margin-top: 10px;
        line-height: 1.5;
      }

      #emptyResult,
      #notice {
        position: absolute;
        top: 24px;
        left: 50%;
        transform: translateX(-20%);
        z-index: 600;
        max-width: 420px;
        border-radius: 14px;
        background: white;
        box-shadow: var(--shadow);
        padding: 14px 18px;
      }

      #notice {
        background: #fff5d8;
      }

      .leaflet-top.leaflet-right {
        top: 14px;
        right: 14px;
      }

      .leaflet-bar {
        border: 0 !important;
        box-shadow: var(--shadow) !important;
        border-radius: 15px !important;
        overflow: hidden;
      }

      .leaflet-bar a {
        width: 44px !important;
        height: 44px !important;
        line-height: 44px !important;
        color: var(--ink) !important;
        border-color: var(--line) !important;
      }

      .leaflet-control-attribution {
        font-size: 9px !important;
        background: #ffffffd9 !important;
      }

      .brand-badge {
        border-radius: 14px;
        box-shadow: 0 3px 12px #17372a30;
        border: 2px solid white;
      }

      .brand-badge:hover {
        transform: translateY(-3px);
      }

      .cluster-pin {
        border: 4px solid white;
        background: #087f5b;
        color: white;
        border-radius: 50%;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 13px;
        box-shadow: 0 3px 14px #17372a38;
      }

      #stationPanel {
        position: absolute;
        z-index: 700;
        top: 24px;
        right: 82px;
        width: 360px;
        max-height: calc(100dvh - 56px);
        overflow: auto;
        padding: 24px;
        background: white;
        border-radius: 24px;
        box-shadow: var(--shadow);
        line-height: 1.65;
      }

      #stationPanel[hidden] {
        display: none;
      }

      #closeStation {
        position: sticky;
        top: 0;
        float: right;
        box-sizing: border-box;
        width: 44px;
        height: 44px;
        min-width: 44px;
        min-height: 44px;
        padding: 0;
        display: grid;
        place-items: center;
        line-height: 1;
        border-radius: 50%;
        font-size: 22px;
        background: #f1f5f2;
        margin: -10px -10px 4px 8px;
      }

      #stationContent > b {
        font-size: 22px;
        line-height: 1.3;
        display: inline-block;
        margin-bottom: 10px;
        max-width: 260px;
      }

      #stationContent a {
        font-weight: 600;
        text-decoration: none;
      }

      #stationContent > p:last-child {
        padding: 14px;
        background: #eaf6ef;
        border-radius: 12px;
        margin-bottom: 0;
      }

      .card {
        padding: 14px 0;
      }

      .warning {
        font-size: 12px;
      }

      .muted {
        font-size: 12px;
      }

      @media (max-width: 700px) {
        header {
          top: 12px;
          left: 12px;
          width: calc(100% - 76px);
          padding: 12px 16px;
          border-radius: 18px 18px 0 0;
        }

        header h1 {
          font-size: 21px;
        }

        header span {
          display: none;
        }

        .filters {
          top: 61px;
          left: 12px;
          width: calc(100% - 76px);
          padding: 0 12px 12px;
          border-radius: 0 0 18px 18px;
        }

        .filters input {
          font-size: 14px;
          padding: 10px;
        }

        .filters select {
          font-size: 11px;
        }

        .locationbar {
          left: 12px;
          bottom: 26px;
          width: calc(100% - 24px);
          padding: 12px;
          border-radius: 18px;
          max-height: 45dvh;
        }

        .locationbar details {
          margin-top: 2px;
        }

        .locationbar summary {
          padding-bottom: 0;
        }

        #stationPanel {
          top: auto;
          right: 8px;
          left: 8px;
          bottom: 20px;
          width: auto;
          max-height: 58dvh;
          border-radius: 24px;
          padding: 22px;
        }

        #emptyResult,
        #notice {
          top: 180px;
          left: 12px;
          transform: none;
          max-width: calc(100% - 24px);
        }

        .leaflet-top.leaflet-right {
          top: 2px;
          right: 2px;
        }

        .leaflet-bar a {
          width: 40px !important;
          height: 40px !important;
          line-height: 40px !important;
        }

        #locationStatus {
          font-size: 11px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }

      .yandex-marker {
        display: block;
        position: absolute;
        min-height: 0;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        overflow: visible;
      }

      .yandex-marker:hover {
        background: transparent;
      }

      .color-marker {
        display: block;
        width: 16px;
        height: 16px;
        border: 2px solid white;
        border-radius: 50%;
        box-shadow: 0 2px 6px #0004;
      }

      .map-tools {
        position: absolute;
        right: 16px;
        top: 24px;
        z-index: 500;
        display: grid;
        gap: 3px;
        box-shadow: var(--shadow);
        border-radius: 14px;
        overflow: hidden;
      }

      .map-tools button {
        width: 44px;
        border: 0;
        border-radius: 0;
        background: white;
        font-size: 23px;
        font-weight: 600;
      }

      .map-tools #tiltMap {
        font-size: 14px;
      }

      .map-tools button[aria-pressed="true"] {
        background: #087f5b;
        color: white;
      }

      .data-credit {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        font-size: 8px;
        z-index: 400;
        background: #ffffffcc;
        padding: 2px 4px;
        white-space: nowrap;
      }

      .locationbar {
        bottom: 44px;
      }

      #notice:empty {
        display: none;
      }

      @media (max-width: 700px) {
        .map-tools {
          right: 12px;
          top: 12px;
        }

        .map-tools button {
          width: 40px;
        }

        .locationbar {
          bottom: 48px;
        }

        #stationPanel {
          bottom: 42px;
        }

        .data-credit {
          bottom: 25px;
          font-size: 7px;
        }
      }

      body {
        height: var(--tg-viewport-stable-height, 100dvh);
      }

      .locationbar {
        bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      }

      #stationPanel {
        max-height: calc(
          var(--tg-viewport-stable-height, 100dvh) - 56px
        );
      }

      @media (max-width: 700px) {
        .locationbar {
          bottom: calc(26px + env(safe-area-inset-bottom, 0px));
        }

        #stationPanel {
          bottom: calc(20px + env(safe-area-inset-bottom, 0px));
          max-height: 58dvh;
        }
      }
    </style>
  <style>
      header {position:absolute}
      #language {position:absolute;right:12px;top:10px;min-height:32px;padding:4px;max-width:100px}
      #nearList {margin-top:8px}
      #nearList h2 {font-size:16px;margin:6px 0}
      #nearRows {max-height:19dvh;overflow:auto}
      #nearRows button {display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left;gap:8px;margin:3px 0}
      #nearRows strong {min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      #nearRows small {white-space:nowrap}

      #stationPanel {padding:20px;border-radius:20px;line-height:1.45}
      .station-operator {display:block;font-size:15px;color:var(--green);margin-bottom:4px}
      .sheet-address {display:block;color:#53645e;margin:0 0 12px}
      .sheet-prices {display:grid;grid-template-columns:1fr 1fr;gap:6px}
      .sheet-prices p,.port-row {background:#f4f5f7;border-radius:10px;padding:10px;margin:0}
      .sheet-prices b {display:block;font-size:12px;color:#505866}
      .sheet-section {font-size:15px;margin:14px 0 6px}
      .port-row {display:flex;align-items:center;gap:9px;margin-bottom:4px}
      .port-row i {background:#414655;color:white;border-radius:7px;padding:5px 8px;font-style:normal}
      .port-row small {display:block;color:#576071}
      .port-row strong {margin-left:auto;white-space:nowrap}
      #stationContent .directions {display:flex;gap:6px;background:none;padding:0}
      #stationContent .directions a {flex:1;text-align:center;background:#4338df;color:white;padding:10px 4px;border-radius:10px}
      .user-location {display:block;width:22px;height:22px;box-shadow:0 0 0 6px #2477ed44,0 2px 5px #0005}
      @media(max-width:700px){
        #stationPanel {bottom:0;left:0;right:0;max-height:54dvh;border-radius:20px 20px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
        body.sheet-open header,body.sheet-open .filters,body.sheet-open .locationbar {visibility:hidden}
      }
      #sheetToggle {display:grid;place-items:center;width:100%;min-height:22px;padding:0;border:0;background:white;touch-action:none}
      .sheetGrip {width:38px;height:5px;border-radius:4px;background:#b7c6c0}
      #sheetToggle[aria-expanded=true] .sheetLabel,.locationbar.folded .sheetGrip {display:none}
      .locationbar.folded {padding:0;overflow:hidden}
      .locationbar.folded #sheetToggle {min-height:48px;font-weight:650;background:var(--green);color:white}
      #locate {touch-action:none}
      #nearRows,.locationbar {overscroll-behavior:contain}
    </style></head>

  <body>
    <header><select id="language" aria-label="Til / Язык / Language"><option value="uz">O‘zbekcha</option><option value="ru">Русский</option><option value="en">English</option></select>
      <h1>⚡️ Quvvat</h1>
      <span>Yo‘lingizdagi quvvat</span>
    </header>

    <div class="locationbar">
      <button id="sheetToggle" type="button" aria-controls="locationBody" aria-expanded="true"><span class="sheetGrip"></span><span class="sheetLabel"></span></button>
      <div id="locationBody">
      <button id="locate">
        📍 Mening joylashuvim
      </button>

      <details>
        <summary>Qidiruv sozlamalari</summary>

        <div class="location-options">
          <button
            id="pickLocation"
            aria-pressed="false"
          >
            Xaritadan markaz tanlash
          </button>

          <button id="clearLocation" disabled>
            Joylashuvni tozalash
          </button>

          <label for="radius">Radius</label>

          <input
            id="radius"
            aria-label="Qidiruv radiusi"
            type="range"
            min="100"
            max="2000"
            step="100"
            value="1000"
            disabled
          />

          <output id="radiusLabel" for="radius">
            1 km
          </output>

          <label>
            <input
              id="nearby"
              type="checkbox"
              disabled
            />
            Faqat shu radiusda
          </label>

          <select
            id="markerStyle"
            aria-label="Xarita belgilari"
          >
            <option value="logo">
              Kompaniya logotiplari
            </option>
            <option value="status">
              Holat ranglari
            </option>
          </select>
        </div>
      </details>

      <section id="nearList" hidden><h2>Yaqin stansiyalar</h2>
      <select id="nearSort" aria-label="↕"><option value="distance">Eng yaqin</option><option value="price">Eng arzon</option></select>
      <div id="nearRows"></div></section><div id="locationStatus" role="status"></div></div>
    </div>

    <div class="filters">
      <input
        id="search"
        aria-label="Stansiya yoki manzil"
        placeholder="Stansiya yoki manzilni qidiring"
      />

      <select id="op" aria-label="Operator">
        <option value="">Barcha operatorlar</option>
      </select>

      <select id="region" aria-label="Viloyat">
        <option value="">Barcha viloyatlar</option>
      </select>
    </div>

    <div id="emptyResult" role="status" hidden></div>

    <div
      id="notice"
      role="status"
      style="display: block"
    >
      Yandex xaritasi yuklanmoqda…
    </div>

    <nav
      class="map-tools"
      aria-label="Xarita boshqaruvi"
    >
      <button id="zoomIn" aria-label="Yaqinlashtirish">
        +
      </button>

      <button id="zoomOut" aria-label="Uzoqlashtirish">
        −
      </button>

      <button
        id="tiltMap"
        aria-label="Xaritani qiya ko‘rish"
        aria-pressed="false"
      >
        3D
      </button>
    </nav>

    <div class="data-credit">
      Stansiyalar: geoBoundaries · Yandex ·
      <a
        href="https://openchargemap.org/poi/details/459383"
        target="_blank"
        rel="noopener noreferrer"
      >
        OCM CC BY 4.0
      </a>
    </div>

    <div
      id="map"
      aria-label="Zaryadlash stansiyalari xaritasi"
    ></div>

    <aside
      id="stationPanel"
      aria-label="Stansiya ma’lumotlari"
      hidden
    >
      <button id="closeStation" aria-label="Yopish">
        ×
      </button>

      <div id="stationContent"></div>
    </aside>

    <script src="./map-language.js"></script>
    <script src="./stations-data.js"></script>

    <script>
      const sheet = document.querySelector(".locationbar");
      const toggle = document.getElementById("sheetToggle");
      const bodyPanel = document.getElementById("locationBody");
      const label = translate("📍 Mening joylashuvim");
      toggle.querySelector(".sheetLabel").textContent = label;
      function foldPanel(folded) {
        sheet.classList.toggle("folded", folded);
        bodyPanel.hidden = folded;
        toggle.setAttribute("aria-expanded", String(!folded));
        toggle.setAttribute("aria-label", label);
        sheet.scrollTop = 0;
      }
      foldPanel(false);
      toggle.addEventListener("click", () => foldPanel(!bodyPanel.hidden));
      let drag = null;
      let suppressClickUntil = 0;
      sheet.addEventListener("touchstart", e => {
        const rowList = e.target.closest("#nearRows");
        drag = e.touches.length === 1 && !bodyPanel.hidden && sheet.scrollTop <= 0 &&
          !(rowList && rowList.scrollTop > 0) && !e.target.closest("select,input")
          ? e.touches[0] : null;
      }, {passive:true});
      sheet.addEventListener("touchmove", e => {
        if (!drag || e.touches.length !== 1) { drag=null; return; }
        const dy = e.touches[0].clientY - drag.clientY;
        const dx = e.touches[0].clientX - drag.clientX;
        if (dy < -8 || Math.abs(dx) > Math.abs(dy)+10) { drag=null; return; }
        if (dy > 12 && e.cancelable) e.preventDefault();
        if (dy > 48) {
          drag = null;
          suppressClickUntil = performance.now()+500;
          foldPanel(true);
        }
      }, {passive:false});
      sheet.addEventListener("touchend", () => { drag=null; });
      sheet.addEventListener("touchcancel", () => { drag=null; });
      sheet.addEventListener("click", e => {
        if (performance.now() < suppressClickUntil) {
          e.preventDefault(); e.stopImmediatePropagation();

      const languageSelect = document.getElementById("language");

      languageSelect.onchange = () => {

        url.searchParams.set("lang", languageSelect.value);

      };
      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
      while (walker.nextNode()) {
        const node = walker.currentNode;

      const search = document.getElementById("search");

      async function initQuvvat() {
        if (location.hostname === "127.0.0.1") {
          const url = new URL(location.href);
          url.hostname = "localhost";
          location.replace(url.href);
          return;
        }

        const apiKey = "90f58cc0-cad8-448e-82da-c79bb5b3ac62";

        if (!apiKey) {
          throw new Error("missing-key");
        }

        await new Promise((resolve, reject) => {
          const script = document.createElement("script");

          const timeout = setTimeout(

            25000
          );

          script.src =
            "https://api-maps.yandex.ru/v3/?apikey=" +
            encodeURIComponent(apiKey) +
            "&lang=" + ({uz:"ru_RU",ru:"ru_RU",en:"en_US"}[pageLanguage]);

          script.onload = () => {
            clearTimeout(timeout);
            resolve();
          };

          script.onerror = () => {
            clearTimeout(timeout);
            reject(new Error("api-load"));
          };

          document.head.appendChild(script);
        });

        await Promise.race([
          ymaps3.ready,
          new Promise((_, reject) =>
            setTimeout(
              () => reject(new Error("timeout")),
              25000
            )
          ),
        ]);

        let payload = window.QUVVAT_DATA;
        let stations = payload.stations;

        /* Qo‘shimcha kompaniya logotiplari */

        payload.logos.beon = {
          data_url: "./beon.png",

        };

        /* Yordamchi funksiyalar */

        const $ = (id) => document.getElementById(id);

        const esc = (s) =>
          String(s ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c]
          );

        let userLocation = null;
        let pickingLocation = false;
        let locationRequest = 0;

        function distanceMeters(a, b) {
          const rad = (x) => (x * Math.PI) / 180;
          const dp = rad(b.lat - a.lat);
          const dl = rad(b.lon - a.lon);

          const v =
            Math.sin(dp / 2) ** 2 +
            Math.cos(rad(a.lat)) *
              Math.cos(rad(b.lat)) *
              Math.sin(dl / 2) ** 2;

          return (
            12742000 *
            Math.asin(Math.sqrt(Math.max(0, Math.min(1, v))))
          );
        }

        function distanceLabel(d) {
          return d < 1000
            ? Math.round(d) + " m"
            : (d / 1000).toFixed(2) + " km";
        }

        const displayNames = {
          tokbor: "TOK BOR",
          kwatt: "K Watt",
          energo: "EnerGo",
          spectre: "Spectre Energy",
          pulseev: "Pulse EV",
          nd: "ND Charger",
          quwatt: "Quwatt",
          yashil: "Yashil Energiya",
          trianon: "Trianon Energy",

          megawatt: "Megawatt Energy",

        const labels = {
          available: "🟢 Bo‘sh",

          unavailable: "⚫ Mavjud emas",
          faulted: "⚫ Nosoz",
          reserved: "🟠 Bron qilingan",
          unknown: "⚪ Noma’lum / eskirgan",
        };

        const now = () => Date.now() / 1000;

        const fresh = (r) =>
          r.refresh_ok && Number(r.expires_at) > now();

        function canonical(t) {
          return (
            {
              "CCS (Type 2)": "CCS2",
              GB_T_DC: "GB/T DC",
              GB_T_AC: "GB/T AC",
              CCS_2: "CCS2",
              IEC_62196_T1_COMBO: "CCS1",
            }[t] || t
          );
        }

        function specs(s) {
          let all = [];

          for (const r of s.live || []) {
            for (const c of r.connectors || []) {
              all.push({
                type: canonical(c.type),
                power: c.power_kw,
                price:
                  fresh(r) && c.price_unit === "Sum/kWh"
                    ? c.price
                    : null,
              });
            }

            if (r.power_kw) {
              all.push({
                power: r.power_kw,
                type: null,
              });
            }
          }

          for (const o of s.observations || []) {
            if (o.power_kw) {
              all.push({
                power: o.power_kw,
                type: null,
              });
            }

            for (const c of o.connectors || []) {
              all.push({
                type: canonical(
                  c.type || c.type_code_as_reported
                ),
                power: c.power_kw,
              });
            }
          }

          return all;
        }

        function connectorState(r, c) {
          return fresh(r) && c.expires_at > now()
            ? c.status
            : "unknown";
        }

        function status(s) {
          const states = [];

          for (const r of s.live || []) {
            if (!fresh(r)) {
              states.push("unknown");
              continue;
            }

            if (r.availability_scope === "connector") {
              states.push(
                ...r.connectors.map((c) =>
                  connectorState(r, c)
                )
              );
            } else if (
              r.availability_scope === "site_count"
            ) {
              states.push(
                r.raw_status !== "active"
                  ? "unavailable"
                  : r.available_count > 0
                    ? "available"
                    : "unknown"
              );
            } else {
              states.push(
                {
                  available: "available",
                  busy: "busy",
                  unavailable: "unavailable",
                }[r.raw_status] || "unknown"
              );
            }
          }

          return states.includes("available")
            ? "available"
            : states.includes("busy")
              ? "busy"
              : states.includes("unknown") || !states.length
                ? "unknown"
                : states[0];
        }

        function options(id, values) {

        /*
         * Interfeysda koordinatalar:
         * [latitude, longitude]

         * Yandex API ichida:

        class MapView {
          constructor(id) {
            this.element = document.getElementById(id);
            this.handlers = {};
            this.lastZoom = 6;

            this.native = new ymaps3.YMap(
              this.element,
              {
                location: {
                  center: [64.5, 41.5],
                  zoom: 6,
                },
                mode: "vector",
                zoomRange: {
                  min: 3,
                  max: 20,
                },
              },
              [
                new ymaps3.YMapDefaultSchemeLayer({}),
                new ymaps3.YMapDefaultFeaturesLayer({}),
              ]
            );

            this.native.addChild(
              new ymaps3.YMapListener({
                layer: "any",

                onUpdate: ({ location, mapInAction }) => {
                  if (
                    !mapInAction &&
                    Math.abs(
                      location.zoom - this.lastZoom
                    ) > 0.01
                  ) {
                    this.lastZoom = location.zoom;
                    this.emit("zoomend");
                  }
                },

                onClick: (object, event) => {
                  if (object?.type === "marker") return;

                  this.emit("click", {
                    latlng: {
                      lat: event.coordinates[1],
                      lng: event.coordinates[0],
                    },
                  });
                },
              })
            );
          }

          emit(event, value) {
            for (const fn of this.handlers[event] || []) {
              fn(value);
            }
          }

          on(event, fn) {
            (this.handlers[event] ??= []).push(fn);
            return this;
          }

          setView([lat, lon], zoom) {
            this.native.setLocation({
              center: [lon, lat],
              zoom,
              duration: 0,
            });

            return this;
          }

          getZoom() {
            return this.native.zoom;
          }

          getContainer() {
            return this.element;
          }

          invalidateSize() {
            // YMap konteyner o‘lchamini o‘zi kuzatadi.
          }

          project([lat, lon], zoom) {
            const sin = Math.sin(
              (Math.max(-85, Math.min(85, lat)) * Math.PI) /
                180
            );

            const scale = 256 * 2 ** zoom;

            return {
              x: ((lon + 180) / 360) * scale,
              y:
                (
                  0.5 -
                  Math.log((1 + sin) / (1 - sin)) /
                    (4 * Math.PI)
                ) * scale,
            };
          }

          fitBounds(points, options = {}) {
            if (!points.length) return;

            const projected = points.map((p) =>
              this.project(p, 0)
            );

            const xs = projected.map((p) => p.x);
            const ys = projected.map((p) => p.y);

            const minX = Math.min(...xs);
            const maxX = Math.max(...xs);
            const minY = Math.min(...ys);
            const maxY = Math.max(...ys);

            const mobile =
              this.element.clientWidth <= 700;

            const left = mobile ? 24 : 395;
            const right = 70;
            const top = mobile ? 185 : 40;
            const bottom = mobile ? Math.max(80,this.element.getBoundingClientRect().bottom-document.querySelector(".locationbar").getBoundingClientRect().top+12) : 50;

            const width = Math.max(
              100,
              this.element.clientWidth - left - right
            );

            const height = Math.max(
              100,
              this.element.clientHeight - top - bottom
            );

            const zoom = Math.max(
              3,
              Math.min(
                options.maxZoom ?? 18,
                Math.log2(
                  width / Math.max(maxX - minX, 0.00001)
                ),
                Math.log2(
                  height / Math.max(maxY - minY, 0.00001)
                )
              )
            );

            const scale = 2 ** zoom;

            const x =
              (minX + maxX) / 2 -
              (left - right) / (2 * scale);

            const y =
              (minY + maxY) / 2 -
              (top - bottom) / (2 * scale);

            const lon = (x / 256) * 360 - 180;

            const lat =
              (
                Math.atan(
                  Math.sinh(
                    Math.PI * (1 - (2 * y) / 256)
                  )
                ) * 180
              ) / Math.PI;

            this.setView([lat, lon], zoom);
          }

          removeLayer(item) {
            item?.remove();
          }
        }

        class MapGroup {
          constructor() {
            this.items = [];
          }

          addTo(map) {
            this.map = map;
            return this;
          }

          clearLayers() {
            for (const item of this.items) {
              item.remove();
            }

            this.items = [];
          }
        }

        class MapObject {
          addTo(target) {
            this.map =
              target instanceof MapGroup
                ? target.map
                : target;

            if (target instanceof MapGroup) {
              target.items.push(this);
            }

            this.map.native.addChild(this.entity);
            return this;
          }

          remove() {
            if (this.map) {
              this.map.native.removeChild(this.entity);
              this.map = null;
            }
          }
        }

        class StationMarker extends MapObject {
          constructor([lat, lon], options = {}) {
            super();

            const icon = options.icon || {};

            this.element = document.createElement("button");
            this.element.type = "button";

            this.element.className =
              "yandex-marker " + (icon.className || "");

            this.element.style.cssText =

            this.element.innerHTML = icon.html || "";

            this.element.title =
              options.title || options.alt || "Stansiya";

            this.element.setAttribute(
              "aria-label",
              this.element.title
            );

            this.entity = new ymaps3.YMapMarker(
              {
                coordinates: [lon, lat],
                zIndex: options.zIndexOffset || 0,
              },
              this.element
            );
          }

          on(event, fn) {
            this.element.addEventListener(event, (e) => {
              e.stopPropagation();
              fn(e);
            });

            return this;
          }

          bindTooltip(text) {
            const el = document.createElement("span");
            el.innerHTML = text;
            this.element.title = el.textContent;
            return this;
          }

          bindPopup(text) {
            this.element.title = String(text);
            return this;
          }

          setPopupContent(text) {
            return this.bindTooltip(text);
          }
        }

        class RadiusOverlay extends MapObject {
          constructor([lat, lon], options) {
            super();

            const radius = options.radius;
            const angular = radius / 6371000;
            const phi = (lat * Math.PI) / 180;
            const lambda = (lon * Math.PI) / 180;
            const points = [];

            for (let i = 0; i <= 96; i++) {
              const bearing = (i * 2 * Math.PI) / 96;

              const p = Math.asin(
                Math.sin(phi) * Math.cos(angular) +
                  Math.cos(phi) *
                    Math.sin(angular) *
                    Math.cos(bearing)
              );

              const l =
                lambda +
                Math.atan2(
                  Math.sin(bearing) *
                    Math.sin(angular) *
                    Math.cos(phi),
                  Math.cos(angular) -
                    Math.sin(phi) * Math.sin(p)
                );

              points.push([
                (l * 180) / Math.PI,
                (p * 180) / Math.PI,
              ]);
            }

            this.bounds = points.map(
              ([lon, lat]) => [lat, lon]
            );

            this.entity = new ymaps3.YMapFeature({
              geometry: {
                type: "Polygon",
                coordinates: [points],
              },

              style: {
                stroke: [
                  {
                    color: options.color || "#2477ed",
                    width: options.weight || 2,
                  },
                ],
                fill:
                  "rgba(36,119,237," +
                  (options.fillOpacity ?? 0.06) +
                  ")",
              },
            });
          }

          getBounds() {
            return this.bounds;
          }
        }

        let selectedStation = null;
        function focusStation(s) {
          const zoom = Math.max(17,map.getZoom());
          const rect = $("map").getBoundingClientRect();
          let latitude = s.lat;
          if (rect.width <= 700) {
            const visibleHeight = Math.max(1,$("stationPanel").getBoundingClientRect().top - rect.top);
            const y = map.project([s.lat,s.lon],zoom).y + (rect.height-visibleHeight)/2;
            latitude = Math.atan(Math.sinh(Math.PI*(1-2*y/(256*2**zoom))))*180/Math.PI;
          }
          map.setView([latitude,s.lon],zoom);
        }

        function renderNearby(list) {
          $("nearList").hidden = !userLocation;
          if (!userLocation) return;
          const entries = list.map(st => {
            const tariff = st.manual_tariffs || operatorTariffs[st.operator] || {};
            const price = !tariff.estimated && Number.isFinite(tariff.day) && tariff.day >= 0 ? tariff.day : Infinity;
            return {st, metres: distanceMeters(userLocation, st), price};
          }).filter(row => row.metres <= Number($("radius").value));
          entries.sort((a,b) => ($("nearSort").value === "price" && a.price !== b.price)
            ? a.price-b.price : a.metres-b.metres);
          const rows = $("nearRows");
          rows.replaceChildren();
          for (const {st, metres, price} of entries) {
            const button = document.createElement("button");
            const name = document.createElement("strong");
            const detail = document.createElement("small");
            name.textContent = st.name;
            detail.textContent = distanceLabel(metres) + " · " + (Number.isFinite(price)

            button.append(name, detail);
            button.onclick = () => showStation(st);
            rows.append(button);

          if (!entries.length) rows.textContent = translate("Bu hududda stansiya topilmadi. Radius yoki filtrni o‘zgartiring.");
        }
        $("nearSort").onchange = () => draw(false);
        function portsHtml(s) {
          const t=(uz,ru,en)=>({uz,ru,en}[pageLanguage]);
          const live=s.live || [], observations=s.observations || [];
          const rows=[];
          // The two labelled outlets were documented in the project owner's station screenshot.
          if (s.operator==="spectre" && s.name==="Turin Universiteti 160 kW K1") {
            for(const label of ["A","B"]) rows.push({label,type:"GB/T",power:80});
          } else {
            const records=live.some(r=>r.connectors?.length) ? live : observations;
            const seen=new Set();
            for(const r of records) for(const c of r.connectors || []) {
              const id=c.id ?? c.source_connector_id;
              if(id!=null && seen.has(String(id))) continue;
              if(id!=null) seen.add(String(id));
              rows.push({label:id!=null ? "#"+id : "⚡",type:canonical(c.type || c.type_code_as_reported) || c.label_as_reported,
                power:c.power_kw,state:r.refresh_ok && fresh(r) && c.expires_at>now() ? c.status : null});
            }
          }
          const unknown=t("Holat noma’lum","Статус неизвестен","Status unknown");
          const states={available:t("Bo‘sh","Свободен","Available"),busy:t("Band","Занят","Busy"),unavailable:t("Mavjud emas","Недоступен","Unavailable"),reserved:t("Band qilingan","Забронирован","Reserved"),faulted:t("Nosoz","Неисправен","Faulted")};
          const powers=[...new Set([...live,...observations].map(r=>r.power_kw).filter(n=>n>0))];
          return '<h3 class="sheet-section">'+t("Ulagichlar","Разъёмы","Connectors")+'</h3>'+
            rows.map(r=>'<div class="port-row"><i>'+esc(r.label)+'</i><div><b>'+esc(r.type || translate("Noma’lum"))+'</b><small>'+esc(states[r.state] || unknown)+'</small></div><strong>'+esc(r.power ? r.power+" kW" : "—")+'</strong></div>').join("")+
            (rows.length ? "" : '<div class="port-row">'+t("Port ma’lumoti kiritilmagan","Нет данных о разъёмах","Connector details unavailable")+'</div>')+
            (powers.length ? '<small>'+t("Stansiya quvvati","Мощность станции","Station power")+': '+esc(powers.join(" / "))+' kW</small>' : "");
        }
        function popup(s) {
          const tariffs =
            s.manual_tariffs ||
            operatorTariffs[s.operator] ||
            {};

          function price(period) {
            const amount = tariffs[period];

            if (
              typeof amount !== "number" ||
              !Number.isFinite(amount) ||
              amount < 0
            ) {
              return esc(translate("Narx noma’lum"));
            }

            return (
              esc(amount.toLocaleString("uz-UZ")) +
              " " + translate("so‘m/kWh") +
              (
                tariffs.estimated
                  ? ' <span class="muted">' + translate("(Taxminiy)") + '</span>'
                  : ""
              )
            );
          }

          const operatorName = s.operator && s.operator !== "noma'lum"
            ? displayNames[s.operator] || s.operator
            : translate("Noma’lum");
          const heading =
            '<strong class="station-operator">' + esc(operatorName) + '</strong>' +
            "<b>" +
            esc(s.name || "Stansiya") +
            '</b><span class="sheet-address">' +
            esc(s.address || s.region || "") +
            "</span>";

          const coords = encodeURIComponent(
            s.lat + "," + s.lon
          );

          const links =
            '<p class="directions"><a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/dir/?api=1&destination=' +
            coords +
            '">' + translate("Google yo‘nalish") + '</a><a target="_blank" rel="noopener noreferrer" href="https://yandex.com/maps/?rtext=~' +
            coords +
            '&rtt=auto">' + translate("Yandex yo‘nalish") + '</a></p>';

          return (
            heading +
            '<div class="sheet-prices"><p><b>' + translate("Kunduzgi narx") + '</b>' +
            price("day") +
            "</p><p><b>" + translate("Kechki narx") + "</b>" +
            price("night") +
            "</p></div>" + portsHtml(s) +
            links
          );
        }

        let markers = [];

        function matches(s) {
          if (
            userLocation &&
            $("nearby").checked &&
            distanceMeters(userLocation, s) >
              Number($("radius").value)
          ) {
            return false;
          }

          if (
            $("op").value &&
            s.operator !== $("op").value
          ) {
            return false;
          }

          if (
            $("region").value &&
            s.region !== $("region").value
          ) {
            return false;
          }

          const q =
            $("search").value.toLocaleLowerCase();

          if (
            q &&
            !(
              s.name +
              " " +
              s.address +
              " " +
              s.operator
            )
              .toLocaleLowerCase()
              .includes(q)
          ) {
            return false;
          }

          return true;
        }

        function draw(fit = false) {
          layer.clearLayers();
          markers = [];

          let list = stations.filter(matches);

          list.sort(
            userLocation
              ? (a, b) =>
                  distanceMeters(userLocation, a) -
                  distanceMeters(userLocation, b)
              : (a, b) =>
                  String(a.name).localeCompare(
                    String(b.name)
                  )
          );

          const colors = {
            available: "#0a9664",
            busy: "#d95049",
            unknown: "#7b8790",
            unavailable: "#343c43",
            reserved: "#db9521",
            faulted: "#343c43",
          };

          let visible = list;

          if (map.getZoom() < 16) {
            const groups = new Map();

            for (const s of list) {
              const p = map.project(
                [s.lat, s.lon],
                map.getZoom()
              );

              const key =
                Math.floor(p.x / 64) +
                ":" +
                Math.floor(p.y / 64);

              if (!groups.has(key)) {
                groups.set(key, []);
              }

              groups.get(key).push(s);
            }

            visible = [];

            for (const group of groups.values()) {
              if (group.length === 1) {
                visible.push(group[0]);
                continue;
              }

              const lat =
                group.reduce((a, s) => a + s.lat, 0) /
                group.length;

              const lon =
                group.reduce((a, s) => a + s.lon, 0) /
                group.length;

              MapUI.marker([lat, lon], {
                title:
                  group.length +
                  " ta stansiya — yaqinlashtirish",

                icon: MapUI.divIcon({
                  className: "",
                  html:
                    '<div class="cluster-pin">' +
                    group.length +
                    "</div>",
                  iconSize: [44, 44],
                  iconAnchor: [22, 22],
                }),
              })
                .on("click", () =>
                  map.setView(
                    [lat, lon],
                    Math.min(16, map.getZoom() + 2)
                  )
                )
                .addTo(layer);
            }
          }

          for (const s of visible) {
            const state = status(s);
            const fill = colors[state] || colors.unknown;
            const brand =
              (payload.logos || {})[s.operator];

            let m;

            if ($("markerStyle").value === "logo") {
              const title =
                displayNames[s.operator] || s.operator;

              const initial =
                s.operator === "noma'lum"
                  ? "?"
                  : title
                      .split(/\s+/)
                      .map((w) => w[0])
                      .join("")
                      .slice(0, 3)
                      .toUpperCase();

              const content =
                brand && brand.data_url
                  ? '<img src="' +
                    esc(brand.data_url) +
                    '" alt="' +
                    esc(title) +
                    '">'
                  : '<span class="fallback">' +
                    esc(initial) +
                    "</span>";

              m = MapUI.marker([s.lat, s.lon], {
                title: title + " — " + s.name,
                alt: title,

                icon: MapUI.divIcon({
                  className: "brand-marker",

                  html:
                    '<div class="brand-badge" style="background:' +
                    esc(brand?.background || "#ffffff") +
                    '">' +
                    content +
                    '<span class="status-dot" style="background:' +
                    fill +
                    '"></span></div>',

                  iconSize: [46, 42],
                  iconAnchor: [23, 21],
                  popupAnchor: [0, -22],
                }),
              });
            } else {
              m = MapUI.circleMarker(
                [s.lat, s.lon],
                {
                  radius: 6,
                  color: "#fff",
                  weight: 1.2,
                  fillColor: fill,
                  fillOpacity: 0.9,
                }
              );
            }

            m.on("click", () => showStation(s))
              .bindTooltip(
                esc(
                  (displayNames[s.operator] || s.operator) +
                    " — " +
                    s.name
                )
              )
              .addTo(layer);

            markers.push({ s, m });
          }

          if (
            fit &&
            userLocation &&
            $("nearby").checked &&
            radiusCircle
          ) {
            map.fitBounds(radiusCircle.getBounds(), {
              padding: [35, 35],
              maxZoom: 18,
              animate: false,
            });
          } else if (fit && list.length) {
            map.fitBounds(
              list.map((s) => [s.lat, s.lon]),
              {
                padding: [25, 25],
                maxZoom: 14,
                animate: false,
              }
            );
          }

          if (
            selectedStation &&
            !list.includes(selectedStation)
          ) {
            closeStation();
          } else if (selectedStation) {
            $("stationContent").innerHTML =
              popup(selectedStation);
          }

          renderNearby(list);
          $("emptyResult").hidden = !!list.length;

          $("emptyResult").textContent = list.length
            ? ""
            : "Bu hududda stansiya topilmadi. Radius yoki filtrni o‘zgartiring.";
        }

        map.on("zoomend", () => draw(false));

        function redrawLocation() {
          if (radiusCircle) {
            map.removeLayer(radiusCircle);
          }

          if (!userLocation) return;

          radiusCircle = MapUI.circle(
            [userLocation.lat, userLocation.lon],
            {
              radius: Number($("radius").value),
              color: "#2477ed",
              weight: 2,
              fillColor: "#2477ed",
              fillOpacity: 0.06,
              interactive: false,
            }
          ).addTo(map);
        }

        /*
         * Yaqindagi stansiya manzili aniq GPS manzil
         * sifatida emas, "yaqinida" deb ko‘rsatiladi.
         */

        function locationName(point) {
          let closest = null;
          let best = Infinity;

          for (const station of stations) {
            if (
              !Number.isFinite(station.lat) ||
              !Number.isFinite(station.lon)
            ) {
              continue;
            }

            const address = String(
              station.address || ""
            ).trim();

            const name = String(
              station.name || ""
            ).trim();

            if (!address && !name) continue;

            const distance = distanceMeters(
              point,
              station
            );

            if (distance < best) {
              closest = station;
              best = distance;
            }
          }

          if (!closest || best > 2000) {
            return point.manual
              ? translate("Xaritadan tanlangan joy")
              : translate("Joylashuvingiz xaritada belgilandi");
          }

          const parts = [
            closest.region,
            closest.address || closest.name,
          ].filter(Boolean);

          return (
            [...new Set(parts)].join(", ") +
            translate(" yaqinida")
          );
        }

        function setLocation(
          lat,
          lon,
          accuracy,
          manual
        ) {
          userLocation = {
            lat,
            lon,
            accuracy,
            manual,
          };

          if (userMarker) {
            map.removeLayer(userMarker);
          }

          if (accuracyCircle) {
            map.removeLayer(accuracyCircle);
          }

          accuracyCircle = null;

          userMarker = MapUI.marker([lat, lon], {
            icon: MapUI.divIcon({
              className: "",
              html: '<div class="user-location"></div>',
              iconSize: [18, 18],
              iconAnchor: [9, 9],
            }),

            zIndexOffset: 1000,

            title: manual
              ? "Tanlangan markaz"
              : "Mening joylashuvim",
          })
            .addTo(map)
            .bindPopup(
              manual
                ? "Xaritadan tanlangan markaz"
                : "Sizning taxminiy joylashuvingiz"
            );

          if (
            !manual &&
            Number.isFinite(accuracy)
          ) {
            accuracyCircle = MapUI.circle(
              [lat, lon],
              {
                radius: accuracy,
                color: "#2477ed",
                weight: 1,
                dashArray: "4 4",
                fillOpacity: 0.03,
                interactive: false,
              }
            ).addTo(map);
          }

          $("nearby").disabled = false;
          $("nearby").checked = true;
          $("radius").disabled = false;
          $("clearLocation").disabled = false;

          const address = locationName(userLocation);

          $("locationStatus").textContent =
            (
              manual
                ? translate("Tanlangan joy: ")
                : translate("Siz turgan joy: ")
            ) + address;

          userMarker.setPopupContent(esc(address));

          redrawLocation();
          draw(true);
        }

        /* Telegram Mini App */

        const tg = window.Telegram?.WebApp;

        if (tg?.initData) {
          tg.ready();
          tg.expand();
          tg.setHeaderColor("#ffffff");
          tg.setBackgroundColor("#f3f7f5");

          if (tg.isVersionAtLeast("7.7")) {
            tg.disableVerticalSwipes();
          }
        }

        function miniAppLocation(
          success,
          failure,
          options
        ) {
          const lm = tg?.LocationManager;

          if (
            tg?.initData &&
            tg.isVersionAtLeast("8.0") &&
            lm
          ) {
            lm.init(() => {
              if (!lm.isLocationAvailable) {
                browserLocation();
                return;
              }

              lm.getLocation((p) => {
                if (p) {
                  success({
                    coords: {
                      latitude: p.latitude,
                      longitude: p.longitude,
                      accuracy: p.horizontal_accuracy,
                    },
                  });
                } else {
                  failure({ code: 1 });
                }
              });
            });
          } else {
            browserLocation();
          }

          function browserLocation() {
            if (navigator.geolocation) {
              navigator.geolocation.getCurrentPosition(
                success,
                failure,
                options
              );
            } else {
              failure({ code: 2 });
            }
          }
        }

        /* Joylashuv tugmalari */

        $("locate").addEventListener("click", () => {
          if (
            !navigator.geolocation &&
            !window.Telegram?.WebApp?.LocationManager
          ) {
            $("locationStatus").textContent =
              translate("Brauzer joylashuvni qo‘llamaydi. Markazni xaritadan tanlang.");
            return;
          }

          pickingLocation = false;

          $("pickLocation").setAttribute(
            "aria-pressed",
            "false"
          );

          map.getContainer().style.cursor = "";

          const request = ++locationRequest;

          $("locate").disabled = true;

          $("locationStatus").textContent =
            translate("Joylashuv aniqlanmoqda… Brauzer ruxsatini tasdiqlang.");

          miniAppLocation(
            (p) => {
              if (request !== locationRequest) return;

              $("locate").disabled = false;

              setLocation(
                p.coords.latitude,
                p.coords.longitude,
                p.coords.accuracy,
                false
              );
            },

            (e) => {
              if (request !== locationRequest) return;

              $("locate").disabled = false;

              $("locationStatus").textContent =
                {
                  1: translate("Joylashuvga ruxsat berilmadi. Brauzer ruxsatini tekshiring yoki markazni xaritadan tanlang."),
                  2: translate("Joylashuvni aniqlab bo‘lmadi. Markazni xaritadan tanlang."),
                  3: translate("Joylashuvni aniqlash vaqti tugadi. Qayta urinib ko‘ring yoki markazni tanlang."),
                }[e.code] || translate("Joylashuv olinmadi.");
            },

            {
              enableHighAccuracy: true,
              timeout: 15000,
              maximumAge: 0,
            }
          );
        });

        $("pickLocation").addEventListener(
          "click",
          () => {
            pickingLocation = !pickingLocation;

            $("pickLocation").setAttribute(
              "aria-pressed",
              String(pickingLocation)
            );

            map.getContainer().style.cursor =
              pickingLocation ? "crosshair" : "";

            if (pickingLocation) {
              $("locationStatus").textContent =
                translate("Qidiruv markazi uchun xaritadagi kerakli joyni bosing.");
            }
          }
        );

        map.on("click", (e) => {
          if (!pickingLocation) return;

          locationRequest++;
          $("locate").disabled = false;
          pickingLocation = false;

          $("pickLocation").setAttribute(
            "aria-pressed",
            "false"
          );

          map.getContainer().style.cursor = "";

          setLocation(
            e.latlng.lat,
            e.latlng.lng,
            null,
            true
          );
        });

        $("clearLocation").addEventListener(
          "click",
          () => {
            locationRequest++;
            userLocation = null;
            pickingLocation = false;

            $("pickLocation").setAttribute(
              "aria-pressed",
              "false"
            );

            map.getContainer().style.cursor = "";
            $("locate").disabled = false;

            for (const item of [
              userMarker,
              radiusCircle,
              accuracyCircle,
            ]) {
              if (item) {
                map.removeLayer(item);
              }
            }

            userMarker = null;
            radiusCircle = null;
            accuracyCircle = null;

            $("nearby").checked = false;
            $("nearby").disabled = true;
            $("radius").disabled = true;
            $("clearLocation").disabled = true;

            $("locationStatus").textContent =
              translate("Joylashuv tozalandi.");

            draw(true);
          }
        );

        $("radius").addEventListener("input", () => {
          $("radiusLabel").textContent = distanceLabel(
            Number($("radius").value)
          );

          redrawLocation();
          draw(false);
        });

        $("radius").addEventListener(
          "change",
          () => draw(true)
        );

        $("nearby").addEventListener(
          "change",
          () => draw(true)
        );

        $("markerStyle").addEventListener(
          "change",
          () => draw(false)
        );

        for (const id of ["op", "region"]) {
          $(id).addEventListener(
            "change",
            () => draw(true)
          );
        }

        $("search").addEventListener(
          "input",
          () => draw(true)
        );

        /* Xaritani ishga tushirish */

        updateOptions();
        draw(true);

        setInterval(() => draw(false), 30000);

        $("notice").style.display = "none";
      }

      /* Xarita yuklanishida xatolik */

      initQuvvat().catch(() => {
        const el = document.getElementById("notice");

        el.style.display = "block";

        el.textContent =
          "Yandex xaritasi yuklanmadi. Internetni va API kalitidagi localhost ruxsatini tekshiring. Yangi sozlama faollashishi 15 daqiqagacha davom etishi mumkin.";

        const actions = document.createElement("div");
        actions.style.marginTop = "12px";

        const retry = document.createElement("button");
        retry.textContent = translate("Qayta urinish");
        retry.onclick = () => location.reload();

        const previous = document.createElement("a");
        previous.href = "./map_previous.html";
        previous.textContent = translate("Avvalgi xaritani ochish");
        previous.style.marginLeft = "12px";

        actions.append(retry, previous);
        el.appendChild(actions);
      });
    </script>
  </body>
</html>
